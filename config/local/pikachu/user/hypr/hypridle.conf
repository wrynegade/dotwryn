# pikachu : screen sleep only (no lock, no suspend)
# launched by ./host.lua via `hypridle -c`

listener {
	timeout    = 600  # 10min (matches the old X11 `xset` blank default)
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
	on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
