<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- strong: the Pokémoji confs append a strong-bound family that otherwise outranks a weak prefer -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Monaspace Argon</family></prefer>
  </alias>
</fontconfig>
