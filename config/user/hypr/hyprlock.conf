source = $DOTWRYN/config/colorschemes/active/hyprlock.conf

$font = Monaspace Argon

general {
	hide_cursor = true
	ignore_empty_input = true
}

background {
	path = screenshot
	blur_passes = 3
	blur_size = 11
	brightness = 0.6
	color = $background
}

label {
	text = $TIME12
	color = $clock
	font_size = 96
	font_family = $font
	position = 0, 220
	halign = center
	valign = center
}

label {
	text = cmd[update:60000] date +'%A %B %d, %Y'
	color = $date
	font_size = 22
	font_family = $font
	position = 0, 110
	halign = center
	valign = center
}

input-field {
	size = 420, 64
	outline_thickness = 4
	rounding = 0

	outer_color = $accent
	inner_color = $background
	font_color = $foreground
	check_color = $verifying
	fail_color = $wrong
	capslock_color = $keypress

	font_family = $font
	placeholder_text = <i>$USER</i>
	fail_text = <i>$FAIL ($ATTEMPTS)</i>

	dots_size = 0.25
	dots_spacing = 0.3
	dots_rounding = 0
	fade_on_empty = false

	position = 0, -40
	halign = center
	valign = center
}
